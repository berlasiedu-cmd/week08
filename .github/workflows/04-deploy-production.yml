name: 04 - Deploy to Production

on:
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests with resolved images
        run: |
          set -e
          SHA="${{ github.event.workflow_run.head_sha }}"
          REGISTRY="${{ vars.ACR_LOGIN_SERVER }}"

          # Substitute the real image tag into each manifest BEFORE applying,
          # instead of applying the "placeholder" image and patching it in a
          # separate step. Applying the placeholder image and then patching it
          # used to create two rollout revisions per deploy (one broken, one
          # good), which made `kubectl rollout undo` unreliable for Task
          # 10.3HD's automated rollback -- it could land on the broken
          # placeholder revision depending on how many deploys had run.
          rm -rf /tmp/k8s-production
          cp -r kubernetes/production /tmp/k8s-production

          sed -i "s#image: placeholder#image: ${REGISTRY}/koalatech-user-service:${SHA}#" /tmp/k8s-production/07-user-service.yaml
          sed -i "s#image: placeholder#image: ${REGISTRY}/koalatech-student-service:${SHA}#" /tmp/k8s-production/08-student-service.yaml
          sed -i "s#image: placeholder#image: ${REGISTRY}/koalatech-lecturer-service:${SHA}#" /tmp/k8s-production/09-lecturer-service.yaml
          sed -i "s#image: placeholder#image: ${REGISTRY}/koalatech-course-service:${SHA}#" /tmp/k8s-production/10-course-service.yaml
          sed -i "s#image: placeholder#image: ${REGISTRY}/koalatech-enrollment-service:${SHA}#" /tmp/k8s-production/11-enrollment-service.yaml
          sed -i "s#image: placeholder#image: ${REGISTRY}/koalatech-frontend:${SHA}#" /tmp/k8s-production/12-frontend.yaml

          kubectl apply -f /tmp/k8s-production/

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n production \
            --timeout=300s

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n production \
            --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n production \
            --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n production \
            --timeout=300s

      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service \
            -n production \
            --timeout=300s

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n production \
            --timeout=300s

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production

  validate-monitoring:
    name: Validate Prometheus & Grafana
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Wait for Grafana to be ready
        run: |
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=grafana \
            -n monitoring \
            --timeout=120s

      - name: Confirm monitoring stack pods are running
        run: |
          kubectl get pods -n monitoring -l release=prometheus -o wide

      - name: Show monitoring stack status
        run: |
          kubectl get pods -n monitoring
          kubectl get svc -n monitoring

  verify-and-rollback:
    name: Verify Error Rate & Auto-Rollback
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install probe dependencies
        run: pip install --quiet requests

      - name: Port-forward user-service
        run: |
          kubectl port-forward -n production svc/user-service 8000:8000 &
          echo $! > /tmp/port-forward.pid
          sleep 5

      - name: Probe live error rate
        id: probe
        continue-on-error: true
        run: |
          python3 scripts/error_rate_probe.py \
            --url http://localhost:8000/health \
            --duration 30 \
            --interval 1 \
            --threshold 0.10

      - name: Automatic rollback on high error rate
        if: steps.probe.outcome == 'failure'
        run: |
          echo "Error-rate threshold exceeded on the new revision -- rolling back automatically."
          kubectl rollout undo deployment/user-service -n production
          kubectl rollout status deployment/user-service -n production --timeout=120s

      - name: Re-probe after rollback
        id: reprobe
        if: steps.probe.outcome == 'failure'
        run: |
          python3 scripts/error_rate_probe.py \
            --url http://localhost:8000/health \
            --duration 20 \
            --interval 1 \
            --threshold 0.10

      - name: Show rollout history
        if: always()
        run: kubectl rollout history deployment/user-service -n production

      - name: Stop port-forward
        if: always()
        run: kill "$(cat /tmp/port-forward.pid)" 2>/dev/null || true
